<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Ballot Box Base Tray / Slot -->
  <!-- Back of Slot -->
  <path d="M120 376 C120 366 128 358 138 358 L374 358 C384 358 392 366 392 376 L392 384 C392 394 384 402 374 402 L138 402 C128 402 120 394 120 384 Z" fill="#173da6" />

  <!-- The Ballot Paper (Gliding into the slot) -->
  <g filter="url(#cardShadow)">
    <path d="M168 116 C168 102 179 91 193 91 L319 91 C333 91 344 102 344 116 L344 374 L168 374 Z" fill="url(#cardGrad)" />
    
    <!-- Top candidate indicator placeholder lines on ballot -->
    <rect x="204" y="136" width="104" height="10" rx="5" fill="#e2e8f0" />
    <rect x="204" y="160" width="70" height="8" rx="4" fill="#cbd5e1" />
    
    <!-- Checkmark Row / Selection Circle with Verified Checkmark -->
    <circle cx="256" cy="242" r="46" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4" />
    
    <!-- Bold Verified Checkmark -->
    <path d="M232 242 L249 259 L283 222" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Additional subtle ballot indicator line -->
    <rect x="204" y="318" width="104" height="8" rx="4" fill="#e2e8f0" />
    <rect x="204" y="336" width="60" height="8" rx="4" fill="#cbd5e1" />
  </g>

  <!-- Front Rim of Ballot Box Slot (Creates depth - paper is sliding inside) -->
  <path d="M112 372 C112 358 124 348 138 348 L374 348 C388 348 400 358 400 372 L400 388 C400 402 388 412 374 412 L138 412 C124 412 112 402 112 388 Z" fill="#1e40af" />
  <path d="M136 364 L376 364" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
